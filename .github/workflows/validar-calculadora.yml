name: Validar calculadora
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nueva_calc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: nueva_calc/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar sintaxis de Python
        run: python -m compileall -q app.py metodos
      - name: Ejecutar pruebas funcionales
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript
        run: |
          node --check static/js/graficas.js
          node --check static/js/nucleo.js
          node --check static/js/tutorial.js
          node --check static/js/procedimientos.js
